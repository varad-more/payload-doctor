AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Payload Doctor serverless analysis API

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Exact frontend origins allowed by CORS (localhost and the Amplify domain)
    Default: http://localhost:5173

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 10
    Tracing: PassThrough

Resources:
  PayloadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  AnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.handler
      Description: Validates, diagnoses, formats, minifies, and repairs JSON payloads
      Policies:
        - AWSLambdaBasicExecutionRole
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Events:
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref PayloadApi
            Path: /analyze
            Method: POST
            PayloadFormatVersion: "2.0"

Outputs:
  ApiUrl:
    Description: Base URL for the Payload Doctor API
    Value: !Sub https://${PayloadApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  AnalyzerFunctionName:
    Description: Lambda function name for logs and operational checks
    Value: !Ref AnalyzerFunction
